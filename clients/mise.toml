# Tools for the client compatibility run (see run.sh). Scoped to clients/
# so it does not affect the rest of the repository.
[settings]
# what is not AWS's own is held back: a release withdrawn or tampered with
# is usually found within days. bump.sh applies this to every such pin,
# those outside this file included.
minimum_release_age = "7d"

[tools]
"aqua:k1LoW/runn" = "1.11.2"
# the Python clients (s3cmd, and obstore/opendal through lib/*.py)
"aqua:astral-sh/uv" = "0.13.9"
bun = "1.4.5"
# the runtimes of the AWS SDKs (lib/sdk); each SDK's own version is pinned
# beside its script
node = "26.13.1"
ruby = "4.0.10"
java = "temurin-25.0.5+8.0.LTS"
"aqua:jbangdev/jbang" = "0.143.0"
dotnet = "10.0.404"
rust = "1.100.0"
# from the release itself: 2.0 renamed its assets, which the aqua registry
# does not follow yet
"github:duckdb/duckdb" = { version = "2.0.0", asset_pattern = "duckdb-cli-linux-amd64.tar.gz" }
"aqua:aws/aws-cli" = "2.40.3"
"aqua:kopia/kopia" = "0.23.1"
"aqua:minio/mc" = "RELEASE.2025-08-13T08-35-41Z"
"aqua:rclone/rclone" = "1.76.0"
"aqua:restic/restic" = "0.20.0"
"pipx:s3cmd" = "2.4.0"
"aqua:peak/s5cmd" = "2.3.0"
"conda:s3fs-fuse" = "1.97"
