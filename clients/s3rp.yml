# The gateway under test: one tenant, one bucket on the compose Ceph RGW.
listen: "127.0.0.1:${PORT}"
tenants:
  - name: main
    users:
      - name: client
        keys:
          - access_key_id: ${ACCESS_KEY}
            secret_access_key: ${SECRET_KEY}
    buckets:
      - name: ${BUCKET}
        backend:
          endpoint: ${BACKEND_ENDPOINT}
          bucket: ${BACKEND_BUCKET}
          access_key_id: ${BACKEND_ACCESS_KEY}
          secret_access_key: ${BACKEND_SECRET_KEY}
        # what the bucket-tags, bucket-lifecycle and bucket-replication
        # scenarios read back; the gateway serves them from here and
        # nothing applies them to the backend
        tags:
          env: compat-run
          team: storage
        lifecycle: |
          <?xml version="1.0" encoding="UTF-8"?>
          <LifecycleConfiguration xmlns="http://s3.amazonaws.com/doc/2006-03-01/">
            <Rule>
              <ID>expire-tmp</ID>
              <Filter><Prefix>tmp/</Prefix></Filter>
              <Status>Enabled</Status>
              <Expiration><Days>7</Days></Expiration>
            </Rule>
            <Rule>
              <ID>abort-uploads</ID>
              <Filter><Prefix></Prefix></Filter>
              <Status>Enabled</Status>
              <AbortIncompleteMultipartUpload><DaysAfterInitiation>3</DaysAfterInitiation></AbortIncompleteMultipartUpload>
            </Rule>
          </LifecycleConfiguration>
        replication: |
          <?xml version="1.0" encoding="UTF-8"?>
          <ReplicationConfiguration xmlns="http://s3.amazonaws.com/doc/2006-03-01/">
            <Role>replication</Role>
            <Rule>
              <ID>to-backup</ID>
              <Priority>1</Priority>
              <Status>Enabled</Status>
              <Filter><Prefix>docs/</Prefix></Filter>
              <DeleteMarkerReplication><Status>Disabled</Status></DeleteMarkerReplication>
              <Destination><Bucket>arn:aws:s3:::compat-backup</Bucket></Destination>
            </Rule>
          </ReplicationConfiguration>
