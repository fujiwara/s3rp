[package]
name = "s3rp-clients-sdk-rust"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "client"
path = "src/main.rs"

[dependencies]
aws-config = { version = "=1.13.3", features = ["behavior-version-latest"] }
aws-sdk-s3 = "=1.161.0"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "fs", "io-util"] }
