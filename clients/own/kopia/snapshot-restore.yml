desc: Snapshot a tree into a new repository, verify it, restore it and run maintenance
steps:
  create:
    exec:
      command: kopia repository create s3 --bucket $BUCKET --prefix kopia/ --endpoint $KOPIA_ENDPOINT
    test: current.exit_code == 0
  snapshot:
    exec:
      command: kopia snapshot create $FIXTURES/tree $FIXTURES/big.bin
    test: current.exit_code == 0
  verify:
    exec:
      command: kopia snapshot verify --verify-files-percent 100
    test: current.exit_code == 0
  restore:
    exec:
      command: |
        kopia restore $FIXTURES/tree $OUT_DIR/restore/tree
        kopia restore $FIXTURES/big.bin $OUT_DIR/restore/big.bin
    test: current.exit_code == 0
  same:
    exec:
      command: |
        cmp $FIXTURES/big.bin $OUT_DIR/restore/big.bin
        diff -r $FIXTURES/tree $OUT_DIR/restore/tree
    test: current.exit_code == 0
  maintenance:
    exec:
      command: kopia maintenance run --full
    test: current.exit_code == 0
