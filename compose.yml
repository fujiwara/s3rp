services:
  versitygw:
    image: versity/versitygw:latest
    command: ["--access", "backendkey", "--secret", "backendsecret", "posix", "--versioning-dir", "/versions", "/data"]
    ports:
      - "127.0.0.1:7070:7070"
    tmpfs:
      - /data
      - /versions

  # RustFS backend for compatibility tests.
  # start explicitly: docker compose up -d --wait rustfs
  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:1.0.0}
    profiles: [rustfs]
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: backendkey
      RUSTFS_SECRET_KEY: backendsecret
      # a single tmpfs disk; the strict topology check targets production layouts
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
      # local KMS for SSE-KMS with a static public test key (testkey-1, the
      # same key material as the ceph service), stored unencrypted, which
      # needs the insecure dev defaults
      RUSTFS_KMS_ENABLE: "true"
      RUSTFS_KMS_BACKEND: local
      RUSTFS_KMS_KEY_DIR: /kms
      RUSTFS_KMS_ALLOW_INSECURE_DEV_DEFAULTS: "true"
    ports:
      - "127.0.0.1:9000:9000"
    # the local KMS insists on an owner-only key directory, which a bind
    # mount cannot provide, so the key is copied into a private tmpfs
    entrypoint: ["/bin/sh", "-c", "cp /kms-src/*.key /kms/ && chmod 600 /kms/*.key && exec /entrypoint.sh rustfs"]
    tmpfs:
      - /data:uid=10001,gid=10001
      - /kms:uid=10001,gid=10001,mode=0700
    volumes:
      - ./docker/rustfs-kms:/kms-src:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  # heavyweight Ceph RGW backend for compatibility tests.
  # start explicitly: docker compose up -d --wait ceph
  # NOTE: access RGW via http://127.0.0.1:7480 (not localhost) — RGW
  # resolves non-matching Host names as virtual-hosted bucket names.
  # quay.io/ceph/demo stopped being published after squid, so the release
  # image is bootstrapped by docker/ceph-demo.sh (a trimmed port of the
  # demo entrypoint: mon + mgr + one OSD + RGW + admin user).
  ceph:
    image: ${CEPH_IMAGE:-quay.io/ceph/ceph:v20}
    profiles: [ceph]
    network_mode: host
    entrypoint: ["/ceph-demo.sh"]
    volumes:
      - ./docker/ceph-demo.sh:/ceph-demo.sh:ro
    environment:
      MON_IP: 127.0.0.1
      CEPH_PUBLIC_NETWORK: 127.0.0.1/32
      CEPH_DEMO_UID: demo
      CEPH_DEMO_ACCESS_KEY: backendkey
      CEPH_DEMO_SECRET_KEY: backendsecret
      RGW_FRONTEND_PORT: 7480
      # SSE over plain http (RGW requires TLS for SSE by default), with the
      # built-in "testing" KMS backend so SSE-KMS works without a real KMS.
      # The key is the 32-byte example from the Ceph docs.
      CEPH_ARGS: >-
        --rgw_crypt_require_ssl=false
        --rgw_crypt_s3_kms_backend=testing
        --rgw_crypt_s3_kms_encryption_keys=testkey-1=YmluCmJvb3N0CmJvb3N0LWJ1aWxkCmNlcGguY29uZgo=
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:7480/"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
