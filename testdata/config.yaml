      bucket: photos-prod
      access_key_id: ${TEST_BACKEND_ACCESS_KEY_ID}
      secret_access_key: ${TEST_BACKEND_SECRET_ACCESS_KEY}
    keys:
      - access_key_id: S3RPKEY001
        secret_access_key: frontsecret001
