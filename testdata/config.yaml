listen: ":8080"
virtual_host_suffix: s3.example.com
circuit_breaker: {failures: 5, cooldown: 30s}
tenants:
  - name: acme
    users:
      - name: app1
        keys:
          - access_key_id: S3RPKEY001
            secret_access_key: frontsecret001
          - access_key_id: S3RPKEY002
            secret_access_key: frontsecret002
      - name: batch
        keys:
          - access_key_id: S3RPKEY003
            secret_access_key: frontsecret003
        policy:
          - effect: Allow
            action: [s3:Get*, s3:List*]
          - effect: Deny
            action: [s3:GetObjectAcl]
    buckets:
      - name: photos
        created_at: 2026-01-02T03:04:05Z
        backend:
          endpoint: http://backend.example.com:7480
          region: us-east-1
          bucket: photos-prod
          access_key_id: ${TEST_BACKEND_ACCESS_KEY_ID}
          secret_access_key: ${TEST_BACKEND_SECRET_ACCESS_KEY}
      - name: logs
        tags: {env: prod, team: storage}
        backend:
          endpoint: http://backend2.example.com:9000
          access_key_id: logskey
          secret_access_key: logssecret
        lifecycle: |
          <LifecycleConfiguration xmlns="http://s3.amazonaws.com/doc/2006-03-01/">
            <Rule>
              <ID>expire</ID>
              <Filter><Prefix></Prefix></Filter>
              <Status>Enabled</Status>
              <Expiration><Days>30</Days></Expiration>
            </Rule>
          </LifecycleConfiguration>
        replication: |
          <ReplicationConfiguration xmlns="http://s3.amazonaws.com/doc/2006-03-01/">
            <Role>replication</Role>
            <Rule>
              <ID>to-photos</ID>
              <Status>Enabled</Status>
              <Destination><Bucket>arn:aws:s3:::photos</Bucket></Destination>
            </Rule>
          </ReplicationConfiguration>
  - name: umbrella
    users:
      - name: research1
        keys:
          - access_key_id: S3RPKEY101
            secret_access_key: frontsecret101
    buckets:
      - name: research
        backend:
          endpoint: http://backend.example.com:7480
          access_key_id: researchkey
          secret_access_key: researchsecret
