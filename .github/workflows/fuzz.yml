# Nightly fuzzing of the auth path. Fuzzing is two-layered here: the seed
# corpus and every crasher committed under testdata/fuzz/ replay as
# ordinary regressions in `go test` (test.yml, on every push), while the
# exploration that finds new inputs runs here, on a schedule, so it never
# blocks a PR. A failure is an input to triage, not a broken build: the
# crasher lands as an artifact, and committing it under testdata/fuzz/
# turns it into a permanent regression.
#
# Targets are discovered from the tree, so a new one is picked up without
# touching this file. Cost is one runner per target for FUZZTIME (default
# 10m), which GitHub bills at nothing for a public repository.
name: fuzz
on:
  schedule:
    - cron: '17 18 * * *' # 03:17 JST
  workflow_dispatch:
    inputs:
      fuzztime:
        description: How long to fuzz each target (go test -fuzztime)
        type: string
        default: 10m

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  discover:
    name: Discover targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: List fuzz targets
        id: list
        run: |
          python3 - <<'EOF'
          import json, os, pathlib, re
          targets = []
          for path in sorted(pathlib.Path(".").rglob("*_test.go")):
              pkg = "./" + str(path.parent).removeprefix("./")
              for m in re.finditer(r"^func (Fuzz\w+)\(", path.read_text(), re.M):
                  targets.append({"pkg": pkg, "target": m.group(1)})
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("targets=" + json.dumps(targets) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Fuzzing {len(targets)} targets:\n\n")
              for t in targets:
                  summary.write(f"- `{t['target']}` ({t['pkg']})\n")
          EOF

  # botocore, curl --aws-sigv4 and aws4 (npm) are independent SigV4
  # implementations: requests they sign are what non-Go clients send, and
  # the verifier shares no signing code with any of them. Fresh vectors
  # from the latest botocore and aws4 — deliberately unpinned — and the
  # runner's distro curl mean a signer behavior change fails a nightly
  # here, not a customer.
  crosscheck:
    name: signer cross-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Generate vectors with the latest botocore
        # explicit bash so pipefail is on: without it a generator failure
        # would vanish into tee's exit status and the replay would pass on
        # the committed corpus alone, testing nothing fresh
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet botocore
          mkdir -p "$RUNNER_TEMP/crosscheck"
          "$RUNNER_TEMP/venv/bin/python" sigv4/testdata/crosscheck/generate.py \
            --seed "$SEED" --count 512 --out "$RUNNER_TEMP/crosscheck/botocore-generated.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          SEED: ${{ github.run_id }}

      - name: Generate vectors with the system curl
        shell: bash
        run: |
          python3 sigv4/testdata/crosscheck/generate_curl.py \
            --seed "$SEED" --count 256 --out "$RUNNER_TEMP/crosscheck/curl-generated.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          SEED: ${{ github.run_id }}

      - name: Generate vectors with the latest aws4
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/aws4"
          npm install --prefix "$RUNNER_TEMP/aws4" aws4
          NODE_PATH="$RUNNER_TEMP/aws4/node_modules" node sigv4/testdata/crosscheck/generate_aws4.js \
            --seed "$SEED" --count 512 --out "$RUNNER_TEMP/crosscheck/aws4-generated.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          SEED: ${{ github.run_id }}

      - name: Replay against the verifier
        run: |
          for f in botocore curl aws4; do
            test -s "$S3RP_CROSSCHECK_DIR/$f-generated.json" # fresh vectors exist
          done
          go test ./sigv4 -run TestCrossCheck
        env:
          S3RP_CROSSCHECK_DIR: ${{ runner.temp }}/crosscheck

      - name: Upload the failing vectors
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crosscheck-vectors
          path: ${{ runner.temp }}/crosscheck/

  fuzz:
    name: ${{ matrix.target }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.targets) }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          # the corpus cache below owns GOCACHE for this workflow; setup-go's
          # own cache is keyed by go.sum and would not accumulate a corpus
          cache: false

      - name: Locate the generated corpus
        id: corpus
        run: |
          echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"

      # Carrying the generated corpus between runs is what makes a nightly
      # 10 minutes worth more than a cold 10 minutes: each run starts from
      # the inputs earlier runs found interesting.
      - name: Restore the corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-${{ matrix.target }}-

      - name: Fuzz
        shell: bash
        run: |
          go test "$PKG" -run '^$' -fuzz "^${TARGET}\$" -fuzztime "$FUZZTIME" 2>&1 | tee fuzz.log
        env:
          PKG: ${{ matrix.pkg }}
          TARGET: ${{ matrix.target }}
          FUZZTIME: ${{ inputs.fuzztime || '10m' }}

      # How far a target actually got is the number worth reading, whether
      # or not it found anything.
      - name: Report
        if: always()
        shell: bash
        run: |
          if [ ! -f fuzz.log ]; then
            exit 0
          fi
          {
            printf '### %s\n\n' "$TARGET"
            grep -E '^fuzz: elapsed' fuzz.log | tail -1 || echo 'no progress reported'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          TARGET: ${{ matrix.target }}

      # A failing target wrote the input that reproduces it; keep it, since
      # the corpus cache is not where a crasher belongs.
      - name: Upload the crasher
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crasher-${{ matrix.target }}
          path: ${{ matrix.pkg }}/testdata/fuzz/${{ matrix.target }}/
          if-no-files-found: warn
