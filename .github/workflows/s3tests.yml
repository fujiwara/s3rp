# Runs the ceph/s3-tests compatibility suite (s3tests/run.sh) against the
# compose ceph service, the same backend as a local run. Manually
# triggered: the run takes tens of
# minutes and its outcome is a classified report, not a pass/fail — the
# job succeeds when the suite ran, and the triage report lands in the job
# summary (full results as artifacts).
name: s3-tests
on:
  workflow_dispatch:
    inputs:
      image:
        description: Ceph release image for the compose ceph service
        type: choice
        # compose.yml's pinned image, which dependabot keeps current
        default: compose default
        options:
          - compose default
          - quay.io/ceph/ceph:v19

permissions:
  contents: read

jobs:
  s3tests:
    name: s3-tests (ceph)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: false # run.sh installs the tools pinned in s3tests/mise.toml

      - name: Start the ceph backend
        run: |
          docker compose up -d --wait ceph
          echo "backend: $(docker compose exec ceph ceph version)" >> "$GITHUB_STEP_SUMMARY"
        env:
          CEPH_IMAGE: ${{ inputs.image != 'compose default' && inputs.image || '' }}

      - name: Run the suite
        run: ./s3tests/run.sh
        env:
          CEPH_IMAGE: ${{ inputs.image != 'compose default' && inputs.image || '' }}
          # mise-action v5 no longer exports its token; run.sh's mise install
          # needs one against GitHub API rate limits
          MISE_GITHUB_TOKEN: ${{ github.token }}

      - name: Put the triage report in the job summary
        if: always()
        run: |
          if [ -f s3tests/work/results/report.md ]; then
            cat s3tests/work/results/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no report produced — see the run logs" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s3tests-results
          path: s3tests/work/results/
          if-no-files-found: warn
