name: Go
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        go:
          - '1.25'
          - '1.26'
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
        id: go

      - name: Build & Test
        run: |
          go test -race ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      # Each package is measured by its own tests, not the whole tree's, so
      # the number answers "how well is this package tested" — which is what
      # matters for the packages meant to be reusable on their own.
      - name: Test with coverage
        run: |
          go test -covermode=atomic -coverprofile=cover.out ./... | tee test.out

      - name: Report
        run: |
          {
            echo "| package | coverage |"
            echo "| --- | ---: |"
            awk '/coverage:/ {
              pkg = ""; cov = ""
              for (i = 1; i <= NF; i++) {
                if ($i ~ /^github\.com\/fujiwara\/s3rp/) pkg = $i
                if ($i == "coverage:") cov = $(i + 1)
              }
              if (pkg == "") next
              if ($1 != "ok") cov = "no tests"
              sub("github.com/fujiwara/s3rp/?", "", pkg)
              if (pkg == "") pkg = "(root)"
              printf "| %s | %s |\n", pkg, cov
            }' test.out
            echo
            go tool cover -func=cover.out | awk '$1 == "total:" {print "**total: " $NF "**"}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: cover.out

  integration:
    name: Integration (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: versitygw
            endpoint: "http://localhost:7070"
          - backend: ceph
            endpoint: "http://127.0.0.1:7480"
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Start backend
        run: |
          docker compose up -d --wait "$BACKEND"
        env:
          BACKEND: ${{ matrix.backend }}

      - name: Integration Test
        run: |
          go test -race -run TestIntegration -v ./...
        env:
          S3RP_TEST_BACKEND_ENDPOINT: ${{ matrix.endpoint }}
