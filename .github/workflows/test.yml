name: Go
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        go:
          - '1.26'
          - '1.27'
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
        id: go

      - name: Build & Test
        run: |
          go test -race ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      # Each package is measured by its own tests, not the whole tree's, so
      # the number answers "how well is this package tested" — which is what
      # matters for the packages meant to be reusable on their own.
      - name: Test with coverage
        run: |
          go test -covermode=atomic -coverprofile=cover.out ./... | tee test.out

      - name: Report
        run: |
          {
            echo "| package | coverage |"
            echo "| --- | ---: |"
            awk '/coverage:/ {
              pkg = ""; cov = ""
              for (i = 1; i <= NF; i++) {
                if ($i ~ /^github\.com\/fujiwara\/s3rp/) pkg = $i
                if ($i == "coverage:") cov = $(i + 1)
              }
              if (pkg == "") next
              if ($1 != "ok") cov = "no tests"
              sub("github.com/fujiwara/s3rp/?", "", pkg)
              if (pkg == "") pkg = "(root)"
              printf "| %s | %s |\n", pkg, cov
            }' test.out
            echo
            go tool cover -func=cover.out | awk '$1 == "total:" {print "**total: " $NF "**"}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: cover.out

  integration:
    name: Integration (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: versitygw
            endpoint: "http://localhost:7070"
          - backend: ceph
            endpoint: "http://127.0.0.1:7480"
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Start backend
        run: |
          docker compose up -d --wait "$BACKEND"
        env:
          BACKEND: ${{ matrix.backend }}

      # -json keeps each subtest's outcome and skip reason machine-readable
      # for the summary job; the plain output is replayed into the log.
      - name: Integration Test
        run: |
          go test -race -run TestIntegration -json ./... | tee test.json | jq -j 'select(.Output) | .Output'
        env:
          S3RP_TEST_BACKEND_ENDPOINT: ${{ matrix.endpoint }}

      - name: Collect results
        if: ${{ !cancelled() }}
        run: |
          jq -s --arg backend "$BACKEND" '
            [.[] | select((.Test // "") | startswith("TestIntegration/"))] as $ev
            | {backend: $backend, results: [
                $ev[] | select(.Action == "pass" or .Action == "fail" or .Action == "skip")
                | .Test as $t
                | {
                    test: ($t | ltrimstr("TestIntegration/")),
                    result: .Action,
                    reason: (if .Action == "skip" then
                      [$ev[] | select(.Test == $t and .Action == "output") | .Output
                        | select(test("^\\s+\\S+\\.go:\\d+: "))
                        | sub("^\\s+\\S+\\.go:\\d+: "; "") | rtrimstr("\n")] | join(" ")
                    else null end)
                  }
              ]}' test.json > "integration-$BACKEND.json"
        env:
          BACKEND: ${{ matrix.backend }}

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-${{ matrix.backend }}
          path: integration-${{ matrix.backend }}.json

  # One table across the backend matrix: which subtests each backend
  # passes, fails, or skips for lack of support (with the skip reason).
  integration-summary:
    name: Integration summary
    needs: integration
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: integration-*
          merge-multiple: true

      - name: Report
        run: |
          jq -s -r '
            def mark: {pass: "✅", fail: "❌", skip: "⏭️"}[. // ""] // "—";
            . as $b
            | (reduce ($b[].results[].test) as $t ([]; if index([$t]) then . else . + [$t] end)) as $tests
            | "| test | " + ([$b[].backend] | join(" | ")) + " |",
              "| --- |" + ([$b[] | " :---: |"] | join("")),
              ($tests[] as $t
                | "| \($t) | " + ([$b[] | ([.results[] | select(.test == $t)][0].result | mark)] | join(" | ")) + " |"),
              "",
              ([$b[] | .backend as $n | .results[] | select(.result == "skip")
                | "- **\($n)** \(.test): \(.reason)"] | if length > 0 then "Skipped:", "", .[] else empty end)
          ' integration-*.json >> "$GITHUB_STEP_SUMMARY"
