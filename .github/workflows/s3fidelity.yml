# Runs the S3 fidelity tests of aws/aws-emulator-evaluation-suite
# (s3fidelity/run.sh) against the compose ceph service: weekly, on demand,
# and on a pull request that touches the run itself. The suite is pinned,
# so a run changes only when the gateway or the backend image does; weekly
# is often enough to catch either without running the few minutes on
# every pull request. The job fails on a
# failure s3fidelity/expected.tsv does not list, or a listed one that
# passed; the triage report lands in the job summary (full results as
# artifacts).
name: s3-fidelity
on:
  schedule:
    - cron: '37 18 * * 0' # Monday 03:37 JST
  workflow_dispatch:
  pull_request:
    paths:
      - s3fidelity/**
      - s3gw/localbackend/**
      - .github/workflows/s3fidelity.yml

permissions:
  contents: read

jobs:
  s3fidelity:
    name: s3-fidelity (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # localbackend is the in-process backend (s3gw/localbackend), kept
        # in a directory: no backend to start, its own expected failures
        backend: [ceph, localbackend]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27'

      - name: Set up mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: false # run.sh installs the tools pinned in mise.toml and s3fidelity/mise.toml

      - name: Start the ceph backend
        if: matrix.backend == 'ceph'
        run: |
          docker compose up -d --wait ceph
          echo "backend: $(docker compose exec ceph ceph version)" >> "$GITHUB_STEP_SUMMARY"

      - name: Run the suite
        run: ./s3fidelity/run.sh
        env:
          # unset, run.sh uses the compose ceph
          S3RP_TEST_BACKEND_ENDPOINT: ${{ matrix.backend == 'localbackend' && format('directory:{0}/localbackend', runner.temp) || '' }}
          # mise-action v5 no longer exports its token; run.sh's mise install
          # needs one against GitHub API rate limits
          MISE_GITHUB_TOKEN: ${{ github.token }}

      - name: Put the triage report in the job summary
        if: always()
        run: |
          if [ -f s3fidelity/work/results/report.md ]; then
            cat s3fidelity/work/results/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no report produced — see the run logs" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s3fidelity-results-${{ matrix.backend }}
          path: s3fidelity/work/results/
          if-no-files-found: warn
