# Runs real S3 clients (clients/run.sh) against s3rp on the compose
# Ceph RGW service (ceph-tls), https on both sides: weekly, on demand, and on a pull
# request that touches the run itself. Clients and backend are pinned, so
# a run changes only when the gateway does; it is not part of the
# pull-request checks because it needs FUSE and the clients' package
# registries. The job fails on a failure clients/expected.tsv does not
# list, or a listed one that passed; the report lands in the job summary
# (full results as artifacts).
name: clients
on:
  schedule:
    - cron: '17 18 * * 0' # Monday 03:17 JST
  workflow_dispatch:
  pull_request:
    paths:
      - clients/**
      - .github/workflows/clients.yml

permissions:
  contents: read

jobs:
  clients:
    name: clients (ceph)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APT_PACKAGES: fuse3 wine wine32:i386 xvfb
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27'

      - name: Set up mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install: false # run.sh installs the tools pinned in mise.toml and clients/mise.toml

      # WinSCP is a 32-bit program, and Wine for it is some 250 MB of packages
      # whose download from the runner's mirror took from one minute to eight.
      # They are kept in a cache keyed by the exact files apt would fetch.
      - name: Resolve the packages for FUSE (s3fs) and Wine (WinSCP)
        id: apt
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          set -o pipefail
          mkdir -p "$HOME/apt-archives"
          key=$(apt-get install --print-uris -y -o Dir::Cache::archives="$HOME/apt-archives" $APT_PACKAGES |
            grep '\.deb ' | awk '{print $2, $4}' | sort | sha256sum | cut -d' ' -f1)
          echo "key=clients-apt-$key" >> "$GITHUB_OUTPUT"

      - name: Restore the packages
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt.outputs.key }}
          restore-keys: clients-apt-

      - name: Install FUSE (s3fs) and Wine (WinSCP)
        run: |
          apt_get() { sudo apt-get -o Dir::Cache::archives="$HOME/apt-archives" -o APT::Keep-Downloaded-Packages=true "$@"; }
          apt_get install -y $APT_PACKAGES
          # drop what a restored older cache held and the mirror no longer serves
          apt_get autoclean
          sudo chown -R "$(id -u)" "$HOME/apt-archives"

      - name: Save the packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt.outputs.key }}

      - name: Run the clients
        run: ./clients/run.sh
        env:
          # mise-action v5 no longer exports its token; run.sh's mise install
          # needs one against GitHub API rate limits
          MISE_GITHUB_TOKEN: ${{ github.token }}

      - name: Put the report in the job summary
        if: always()
        run: |
          if [ -f clients/work/results/report.md ]; then
            cat clients/work/results/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no report produced — see the run logs" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clients-results
          path: clients/work/results/
          if-no-files-found: warn
