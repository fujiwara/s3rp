# Runs real S3 clients (clients/run.sh) against s3rp on the compose
# versitygw service, over http and https: weekly, on demand, and on a pull
# request that touches the run itself. Clients and backend are pinned, so
# a run changes only when the gateway does; it is not part of the
# pull-request checks because it needs FUSE and the clients' package
# registries. The job fails on a failure clients/expected.tsv does not
# list, or a listed one that passed; the report lands in the job summary
# (full results as artifacts).
name: clients
on:
  schedule:
    - cron: '17 18 * * 0' # Monday 03:17 JST
  workflow_dispatch:
  pull_request:
    paths:
      - clients/**
      - .github/workflows/clients.yml

permissions:
  contents: read

jobs:
  clients:
    name: clients (versitygw)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Set up mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install: false # run.sh installs the tools pinned in mise.toml and clients/mise.toml

      - name: Install FUSE (s3fs)
        run: sudo apt-get update && sudo apt-get install -y fuse3

      - name: Run the clients
        run: ./clients/run.sh
        env:
          # mise-action v5 no longer exports its token; run.sh's mise install
          # needs one against GitHub API rate limits
          MISE_GITHUB_TOKEN: ${{ github.token }}

      - name: Put the report in the job summary
        if: always()
        run: |
          if [ -f clients/work/results/report.md ]; then
            cat clients/work/results/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no report produced — see the run logs" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clients-results
          path: clients/work/results/
          if-no-files-found: warn
