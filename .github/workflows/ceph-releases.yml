# Weekly check of the Ceph releases under test against upstream (AGENTS.md,
# "Following Ceph releases"): a release that reached GA but is not the
# default backend yet, and a tested release that reached its end of life.
# Dependabot ignores Ceph majors, so nothing else would notice either.
# Each finding becomes an issue, once: the job itself stays green.
name: ceph-releases
on:
  schedule:
    - cron: '23 18 * * 0' # Monday 03:23 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check Ceph releases
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Compare with the Ceph release index
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/releases.yml" "$RELEASES_URL"
          go run ./internal/cephreleases -releases "$RUNNER_TEMP/releases.yml" | tee "$RUNNER_TEMP/findings.json"
        env:
          RELEASES_URL: https://raw.githubusercontent.com/ceph/ceph/main/doc/releases/releases.yml

      # The title names the release, not a version or a date, so a finding
      # that is still true next week finds its own issue, open or closed.
      - name: Open an issue per new finding
        shell: bash
        run: |
          {
            echo "### Ceph releases"
            echo
            jq -r 'if length == 0 then "Nothing to do." else .[] | "- \(.title)" end' "$RUNNER_TEMP/findings.json"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -c '.[]' "$RUNNER_TEMP/findings.json" | while read -r finding; do
            title=$(jq -r .title <<<"$finding")
            existing=$(gh issue list --state all --search "in:title \"$title\"" --json title --jq '.[].title')
            if grep -qxF "$title" <<<"$existing"; then
              echo "already reported: $title"
              continue
            fi
            gh issue create --title "$title" --body "$(jq -r .body <<<"$finding")"
          done
        env:
          GH_TOKEN: ${{ github.token }}
