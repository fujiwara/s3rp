version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      aws-sdk-go-v2:
        patterns:
          - "github.com/aws/aws-sdk-go-v2*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/s3gw/semconv"
    schedule:
      interval: weekly
  # the integration backends in compose.yml
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # a Ceph major needs docker/ceph-demo.sh changes (v21 did), and its
      # x.1 releases are RCs the tag cannot tell apart: bump it by hand
      - dependency-name: "ceph/ceph"
        update-types: ["version-update:semver-major"]
